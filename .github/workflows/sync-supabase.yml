name: Sync OB → Supabase (2-hourly history + activity log)

on:
  # Every 6 hours (was every 2h). Reduced 2026-07-22: the 2-hourly full-dashboard loads were
  # overloading the free-tier Apps Script proxy (execution-quota/cold-starts → 404s on the
  # dashboard). 4 runs/day keeps the activity log fresh enough while relieving the proxy.
  # Bump back to */2 once the proxy load is fixed (trim APAC tab / move data to a real backend).
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

# If a run is still going when the next fires, let the newer one wait rather than overlap
# (overlapping runs could double-diff and emit duplicate events).
concurrency:
  group: sync-supabase
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright (Chromium)
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium
      - name: Read dashboard → diff → write Supabase (ob_current / ob_event / ob_snapshot)
        env:
          SNAPSHOT_URL: https://spyne-onboarding-dashboard.vercel.app/
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node .github/scripts/snapshot-supabase.js
